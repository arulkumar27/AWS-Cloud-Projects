version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 20

    commands:
      - echo "Installing application dependencies"
      - cd application
      - npm ci

  pre_build:
    commands:
      - echo "Running automated tests"
      - npm test

  build:
    commands:
      - echo "Creating production release"
      - npm prune --omit=dev
      - cd ..
      - mkdir -p release/config
      - cp -R application/src release/
      - cp -R application/public release/
      - cp -R application/node_modules release/
      - cp application/package.json release/
      - cp application/package-lock.json release/
      - cp deployment/config/ecommerce.service release/config/
      - cp deployment/config/nginx.conf release/config/
      - cp deployment/scripts/ssm_deploy.sh release/
      - chmod +x release/ssm_deploy.sh
      - tar -czf ecommerce-release.tar.gz -C release .

  post_build:
    commands:
      - echo "Build and tests completed successfully"
      - echo "Release artifact created at $(date)"

artifacts:
  files:
    - ecommerce-release.tar.gz

cache:
  paths:
    - application/node_modules/**/*
