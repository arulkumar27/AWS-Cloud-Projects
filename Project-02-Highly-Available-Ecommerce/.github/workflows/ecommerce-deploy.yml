name: Deploy Project 02 Ecommerce

on:
  push:
    branches:
      - main
    paths:
      - "Project-02-Highly-Available-Ecommerce/**"
      - ".github/workflows/ecommerce-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecommerce-production
  cancel-in-progress: false

env:
  PROJECT_DIR: Project-02-Highly-Available-Ecommerce
  RELEASE_FILE: ecommerce-${{ github.sha }}.tar.gz

jobs:
  test-build-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/application/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: npm ci

      - name: Run automated tests
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: npm test

      - name: Create production release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/application"
          npm prune --omit=dev

          RELEASE_DIR="$GITHUB_WORKSPACE/release"

          mkdir -p "$RELEASE_DIR/config"

          cp -R src public node_modules "$RELEASE_DIR/"

          cp package.json package-lock.json "$RELEASE_DIR/"

          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/deployment/config/ecommerce.service" \
            "$RELEASE_DIR/config/ecommerce.service"

          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/deployment/config/nginx.conf" \
            "$RELEASE_DIR/config/nginx.conf"

          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/deployment/scripts/ssm_deploy.sh" \
            "$RELEASE_DIR/ssm_deploy.sh"

          chmod +x "$RELEASE_DIR/ssm_deploy.sh"

          cd "$RELEASE_DIR"

          tar -czf "$GITHUB_WORKSPACE/$RELEASE_FILE" .

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload release to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            "$RELEASE_FILE" \
            "s3://${{ vars.DEPLOYMENT_BUCKET }}/deployments/${GITHUB_SHA}.tar.gz"

      - name: Deploy through Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          cat > ssm-command.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "rm -rf /tmp/ecommerce-release",
              "rm -f /tmp/ecommerce-release.tar.gz",
              "mkdir -p /tmp/ecommerce-release",
              "aws s3 cp s3://${{ vars.DEPLOYMENT_BUCKET }}/deployments/${GITHUB_SHA}.tar.gz /tmp/ecommerce-release.tar.gz",
              "tar -xzf /tmp/ecommerce-release.tar.gz -C /tmp/ecommerce-release",
              "chmod +x /tmp/ecommerce-release/ssm_deploy.sh",
              "bash /tmp/ecommerce-release/ssm_deploy.sh /tmp/ecommerce-release"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets \
              "Key=tag:Project,Values=ecommerce-prod" \
              "Key=tag:Environment,Values=production" \
            --parameters file://ssm-command.json \
            --comment "Deploy ecommerce commit ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

          for attempt in {1..60}; do
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[].Status" \
              --output text)

            echo "Deployment status: ${STATUSES:-Pending}"

            if [[ "$STATUSES" == *"Failed"* ||
                  "$STATUSES" == *"TimedOut"* ||
                  "$STATUSES" == *"Cancelled"* ]]; then

              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details

              exit 1
            fi

            if [[ -n "$STATUSES" &&
                  "$STATUSES" != *"Pending"* &&
                  "$STATUSES" != *"InProgress"* &&
                  "$STATUSES" != *"Delayed"* ]]; then

              echo "Deployment completed successfully"
              exit 0
            fi

            sleep 10
          done

          echo "Deployment timed out"

          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details

          exit 1
